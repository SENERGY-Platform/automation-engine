basePath: /
definitions:
  api.ValidateInput:
    properties:
      xml:
        type: string
    type: object
  model.Activity:
    properties:
      data:
        additionalProperties: {}
        type: object
      element_id:
        type: string
      element_type:
        type: string
      instance_id:
        type: string
      kind:
        $ref: '#/definitions/model.ActivityKind'
      run:
        type: integer
      seq:
        type: integer
      time:
        type: string
    type: object
  model.ActivityKind:
    enum:
    - run_started
    - run_ended
    - element_entered
    - element_left
    - flow_taken
    - condition_evaluated
    - variable_set
    - script_log
    - timer_scheduled
    - timer_fired
    - message_waiting
    - message_correlated
    - wait_cancelled
    - task_created
    - task_failed
    - task_completed
    - incident
    - join_waiting
    - restart_scheduled
    type: string
    x-enum-varnames:
    - ActivityRunStarted
    - ActivityRunEnded
    - ActivityElementEntered
    - ActivityElementLeft
    - ActivityFlowTaken
    - ActivityCondition
    - ActivityVariableSet
    - ActivityScriptLog
    - ActivityTimerScheduled
    - ActivityTimerFired
    - ActivityMessageWaiting
    - ActivityMessageReceived
    - ActivityWaitCancelled
    - ActivityTaskCreated
    - ActivityTaskFailed
    - ActivityTaskCompleted
    - ActivityIncident
    - ActivityTokenJoinWaiting
    - ActivityRestartScheduled
  model.ActivityPage:
    properties:
      items:
        items:
          $ref: '#/definitions/model.Activity'
        type: array
      truncated:
        description: older entries have been evicted by the per-instance limit (LONG-03)
        type: boolean
    type: object
  model.Configurable:
    properties:
      aspect_node_ids:
        items:
          type: string
        type: array
      characteristic_id:
        type: string
      function_id:
        type: string
      path:
        type: string
      type:
        type: string
      value: {}
    type: object
  model.Correlation:
    properties:
      duplicate:
        type: boolean
      element_id:
        type: string
      instance_id:
        type: string
      started:
        type: boolean
    type: object
  model.CorrelationResult:
    properties:
      correlations:
        items:
          $ref: '#/definitions/model.Correlation'
        type: array
    type: object
  model.Criteria:
    properties:
      aspect_ids:
        items:
          type: string
        type: array
      characteristic_id:
        type: string
      device_class_id:
        type: string
      function_id:
        type: string
    type: object
  model.Dependent:
    properties:
      id:
        type: string
      kind:
        $ref: '#/definitions/model.Kind'
      namespace:
        type: string
      owner:
        type: string
      reason:
        type: string
    type: object
  model.Deployment:
    properties:
      created_at:
        type: string
      description:
        type: string
      faulty_since:
        description: set when automatic restarts exceeded the restart policy; no automatic
          restarts until reset (INC-04)
        type: string
      id:
        type: string
      model_deleted:
        description: the referenced model has been deleted; the deployment keeps its
          copy of the BPMN (MOD-08)
        type: boolean
      model_id:
        type: string
      model_version:
        type: integer
      name:
        type: string
      namespace:
        type: string
      owner:
        type: string
      retention_days:
        description: retention of history in days, 0 uses the namespace default; capped
          by the limits (HIST-04)
        type: integer
      source:
        type: string
      updated_at:
        type: string
      version:
        type: integer
    type: object
  model.DeploymentInput:
    properties:
      description:
        type: string
      incident_handling:
        allOf:
        - $ref: '#/definitions/model.IncidentHandling'
        description: nil uses the default of the namespace
      model_id:
        type: string
      model_version:
        type: integer
      name:
        type: string
      owner:
        type: string
      retention_days:
        type: integer
      selections:
        additionalProperties:
          $ref: '#/definitions/model.Selection'
        description: device selection per BPMN element id (DEP-05)
        type: object
      source:
        type: string
      svg:
        type: string
      update_strategy:
        allOf:
        - $ref: '#/definitions/model.UpdateStrategy'
        description: required on update
      xml:
        type: string
    type: object
  model.DeploymentVersion:
    properties:
      created_at:
        type: string
      deployment_id:
        type: string
      incident_handling:
        $ref: '#/definitions/model.IncidentHandling'
      model_version:
        type: integer
      selections:
        additionalProperties:
          $ref: '#/definitions/model.Selection'
        description: device selection per BPMN element id (DEP-05)
        type: object
      svg:
        type: string
      update_strategy:
        $ref: '#/definitions/model.UpdateStrategy'
      version:
        type: integer
      xml:
        type: string
    type: object
  model.DeviceSelection:
    properties:
      at_deploy:
        type: boolean
      at_start:
        type: boolean
    type: object
  model.ElementStats:
    properties:
      count:
        type: integer
      element_id:
        type: string
      error_at:
        type: string
      last_at:
        type: string
      last_error:
        type: string
      run:
        type: integer
    type: object
  model.Error:
    properties:
      issues:
        items:
          $ref: '#/definitions/model.Issue'
        type: array
      kind:
        $ref: '#/definitions/model.ErrorKind'
      message:
        type: string
    type: object
  model.ErrorKind:
    enum:
    - bad_request
    - validation
    - not_found
    - forbidden
    - conflict
    - unavailable
    - internal
    type: string
    x-enum-varnames:
    - KindBadRequest
    - KindValidation
    - KindNotFound
    - KindForbidden
    - KindConflict
    - KindUnavailable
    - KindInternal
  model.EventDescription:
    properties:
      aspect_ids:
        items:
          type: string
        type: array
      characteristic_id:
        type: string
      deployment_id:
        type: string
      device_group_id:
        type: string
      device_id:
        type: string
      element_id:
        type: string
      function_id:
        type: string
      id:
        type: string
      import_id:
        type: string
      message_name:
        description: the message name the correlation uses, stable across updates
        type: string
      namespace:
        type: string
      owner:
        type: string
      path:
        description: 'empty: the path follows from function and aspects'
        type: string
      qos:
        description: '1: the message is acknowledged only after the correlation; 0:
          at most once (EVT-05)'
        type: integer
      revision:
        type: integer
      script:
        description: 'condition: true, "true" or a number >= 1 triggers the event'
        type: string
      service:
        description: the service to unmarshal with; artificial for imports
        items:
          type: integer
        type: array
      service_id:
        type: string
      topic:
        description: the Kafka topic with the data
        type: string
      value_variable:
        type: string
      variables:
        additionalProperties:
          type: string
        type: object
      version:
        type: integer
    type: object
  model.HttpPolicy:
    properties:
      allow_hosts:
        items:
          type: string
        type: array
      allow_networks:
        items:
          type: string
        type: array
      allow_ports:
        description: empty allows every port
        items:
          type: integer
        type: array
      deny_hosts:
        items:
          type: string
        type: array
      deny_networks:
        items:
          type: string
        type: array
      enabled:
        type: boolean
      max_response_bytes:
        type: integer
      timeout:
        description: Go duration, default 10s
        type: string
    type: object
  model.HttpSettings:
    properties:
      cloud:
        $ref: '#/definitions/model.HttpPolicy'
      fog:
        $ref: '#/definitions/model.HttpPolicy'
    type: object
  model.IdsInput:
    properties:
      ids:
        items:
          type: string
        type: array
    type: object
  model.Incident:
    properties:
      deployment_id:
        type: string
      deployment_version:
        type: integer
      element_id:
        type: string
      element_name:
        type: string
      id:
        type: string
      instance_id:
        type: string
      message:
        type: string
      namespace:
        type: string
      owner:
        type: string
      run:
        type: integer
      time:
        type: string
      variables:
        additionalProperties: {}
        type: object
    type: object
  model.IncidentHandling:
    properties:
      notify:
        type: boolean
      restart:
        type: boolean
    type: object
  model.Instance:
    properties:
      created_at:
        type: string
      deployment_id:
        type: string
      deployment_name:
        type: string
      deployment_version:
        type: integer
      end_reason:
        type: string
      ended_at:
        type: string
      id:
        type: string
      last_activity_at:
        description: last time an element was entered or left (LONG-13)
        type: string
      model_id:
        type: string
      model_version:
        type: integer
      namespace:
        type: string
      owner:
        type: string
      restart_at:
        description: an automatic restart after an incident is due at this time (INC-02)
        type: string
      run:
        type: integer
      start_variables:
        additionalProperties: {}
        type: object
      started_at:
        type: string
      state:
        $ref: '#/definitions/model.InstanceState'
    type: object
  model.InstanceState:
    enum:
    - running
    - completed
    - terminated
    - incident
    type: string
    x-enum-varnames:
    - StateRunning
    - StateCompleted
    - StateTerminated
    - StateIncident
  model.IoBulk:
    properties:
      get:
        items:
          type: string
        type: array
      set:
        items:
          $ref: '#/definitions/model.IoValue'
        type: array
    type: object
  model.IoValue:
    properties:
      deployment_id:
        description: the value is deleted with this deployment or instance (IO-03)
        type: string
      instance_id:
        type: string
      key:
        type: string
      updated_at:
        type: string
      value: {}
    type: object
  model.IoValueInput:
    properties:
      deployment_id:
        type: string
      instance_id:
        type: string
      value: {}
    type: object
  model.Issue:
    properties:
      element_id:
        type: string
      message:
        type: string
    type: object
  model.Kind:
    enum:
    - models
    - deployments
    - instances
    type: string
    x-enum-varnames:
    - KindModel
    - KindDeployment
    - KindInstance
  model.LevelSettings:
    properties:
      initial_rights:
        allOf:
        - $ref: '#/definitions/model.Principals'
        description: rights every new resource gets besides the owner's administrate
      register:
        description: |-
          register resources in permissions-v2 although the level is not shareable, so that it can
          become shareable later without backfill; nil means true. Shareable levels are always registered.
        type: boolean
      shareable:
        description: rights of others from permissions-v2 count; otherwise only the
          owner and admins have access
        type: boolean
      topic_default_permissions:
        allOf:
        - $ref: '#/definitions/model.Principals'
        description: DefaultPermissions of the permissions-v2 topic; they apply to
          every resource of the topic
    type: object
  model.Limits:
    properties:
      max_activities:
        type: integer
      max_instance_variables_bytes:
        type: integer
      max_tokens:
        type: integer
      max_variable_bytes:
        type: integer
    type: object
  model.ListRule:
    properties:
      allow:
        items:
          type: string
        type: array
      deny:
        items:
          type: string
        type: array
    type: object
  model.MessageInput:
    properties:
      all:
        description: correlate with all waiting instances and message start events
          instead of exactly one
        type: boolean
      instance_id:
        description: optional target instance; with a message start event the instance
          is started under this id
        type: string
      local_variables:
        additionalProperties: {}
        type: object
      message_id:
        description: idempotency key; a message with a known id is not correlated
          twice with the same target (EVT-05)
        type: string
      name:
        type: string
      owner:
        description: restricts correlation to resources of this owner; required for
          admins acting for a tenant
        type: string
      variables:
        additionalProperties: {}
        type: object
    type: object
  model.Model:
    properties:
      created_at:
        type: string
      description:
        type: string
      id:
        type: string
      issues:
        description: validation hints of the latest version; a model with issues can
          be saved but not deployed (MOD-04)
        items:
          $ref: '#/definitions/model.Issue'
        type: array
      name:
        type: string
      namespace:
        type: string
      owner:
        type: string
      publish_description:
        type: string
      published:
        type: boolean
      published_at:
        type: string
      updated_at:
        type: string
      version:
        type: integer
    type: object
  model.ModelInput:
    properties:
      description:
        type: string
      name:
        type: string
      owner:
        description: only admins may create a resource for another owner (SEC-11)
        type: string
      svg:
        type: string
      xml:
        type: string
    type: object
  model.ModelVersion:
    properties:
      created_at:
        type: string
      issues:
        items:
          $ref: '#/definitions/model.Issue'
        type: array
      model_id:
        type: string
      svg:
        type: string
      version:
        type: integer
      xml:
        type: string
    type: object
  model.NamedRef:
    properties:
      id:
        type: string
      name:
        type: string
    type: object
  model.Namespace:
    properties:
      created_at:
        type: string
      deployments:
        $ref: '#/definitions/model.LevelSettings'
      description:
        type: string
      device_selection:
        $ref: '#/definitions/model.DeviceSelection'
      elements:
        $ref: '#/definitions/model.ListRule'
      http:
        allOf:
        - $ref: '#/definitions/model.HttpSettings'
        description: targets of the task type http, separately for cloud and gateway
          (NS-04)
      incident_handling:
        allOf:
        - $ref: '#/definitions/model.IncidentHandling'
        description: default for deployments without own setting
      instances:
        $ref: '#/definitions/model.LevelSettings'
      limits:
        $ref: '#/definitions/model.Limits'
      models:
        $ref: '#/definitions/model.LevelSettings'
      name:
        type: string
      referenced_namespaces:
        description: namespaces whose resources this namespace may create through
          task types (NS-08)
        items:
          type: string
        type: array
      restart_policy:
        $ref: '#/definitions/model.RestartPolicy'
      retention:
        $ref: '#/definitions/model.Retention'
      task_types:
        $ref: '#/definitions/model.ListRule'
      updated_at:
        type: string
      user_deletion:
        description: 'what happens to resources of others that depend on a deleted
          user (SEC-13): reject or cascade'
        type: string
    type: object
  model.OwnerInput:
    properties:
      owner:
        type: string
    type: object
  model.Page-model_Deployment:
    properties:
      items:
        items:
          $ref: '#/definitions/model.Deployment'
        type: array
      limit:
        type: integer
      offset:
        type: integer
      total:
        type: integer
    type: object
  model.Page-model_DeploymentVersion:
    properties:
      items:
        items:
          $ref: '#/definitions/model.DeploymentVersion'
        type: array
      limit:
        type: integer
      offset:
        type: integer
      total:
        type: integer
    type: object
  model.Page-model_Incident:
    properties:
      items:
        items:
          $ref: '#/definitions/model.Incident'
        type: array
      limit:
        type: integer
      offset:
        type: integer
      total:
        type: integer
    type: object
  model.Page-model_Instance:
    properties:
      items:
        items:
          $ref: '#/definitions/model.Instance'
        type: array
      limit:
        type: integer
      offset:
        type: integer
      total:
        type: integer
    type: object
  model.Page-model_IoValue:
    properties:
      items:
        items:
          $ref: '#/definitions/model.IoValue'
        type: array
      limit:
        type: integer
      offset:
        type: integer
      total:
        type: integer
    type: object
  model.Page-model_Model:
    properties:
      items:
        items:
          $ref: '#/definitions/model.Model'
        type: array
      limit:
        type: integer
      offset:
        type: integer
      total:
        type: integer
    type: object
  model.Page-model_ModelVersion:
    properties:
      items:
        items:
          $ref: '#/definitions/model.ModelVersion'
        type: array
      limit:
        type: integer
      offset:
        type: integer
      total:
        type: integer
    type: object
  model.Page-model_Schedule:
    properties:
      items:
        items:
          $ref: '#/definitions/model.Schedule'
        type: array
      limit:
        type: integer
      offset:
        type: integer
      total:
        type: integer
    type: object
  model.PrepareInput:
    properties:
      model_id:
        type: string
      model_version:
        type: integer
      xml:
        type: string
    type: object
  model.PreparedDeployment:
    properties:
      elements:
        items:
          $ref: '#/definitions/model.PreparedElement'
        type: array
      issues:
        description: validation findings; with issues the deployment would be rejected
          (BPMN-18)
        items:
          $ref: '#/definitions/model.Issue'
        type: array
      model_id:
        type: string
      model_version:
        type: integer
      name:
        type: string
      start_parameters:
        items:
          $ref: '#/definitions/model.StartParameter'
        type: array
    type: object
  model.PreparedElement:
    properties:
      criteria:
        $ref: '#/definitions/model.Criteria'
      element_id:
        type: string
      kind:
        description: task or event
        type: string
      lane:
        description: elements of a lane share their devices; the options fulfill the
          criteria of all of them
        type: string
      name:
        type: string
      options:
        items:
          $ref: '#/definitions/model.SelectionOption'
        type: array
    type: object
  model.Principals:
    properties:
      groups:
        additionalProperties:
          $ref: '#/definitions/model.Rights'
        type: object
      roles:
        additionalProperties:
          $ref: '#/definitions/model.Rights'
        type: object
      users:
        additionalProperties:
          $ref: '#/definitions/model.Rights'
        type: object
    type: object
  model.PublishInput:
    properties:
      description:
        type: string
      published:
        type: boolean
    type: object
  model.RestartInput:
    properties:
      deployment_version:
        description: 0 selects the current version of the deployment
        type: integer
    type: object
  model.RestartPolicy:
    properties:
      initial_backoff:
        type: string
      max_backoff:
        type: string
      max_restarts:
        description: automatic restarts per deployment within Window; above, the deployment
          is marked faulty
        type: integer
      window:
        type: string
    type: object
  model.Retention:
    properties:
      default_days:
        type: integer
      max_days:
        type: integer
    type: object
  model.Rights:
    properties:
      administrate:
        type: boolean
      execute:
        type: boolean
      read:
        type: boolean
      write:
        type: boolean
    type: object
  model.Run:
    properties:
      cause:
        $ref: '#/definitions/model.RunCause'
      deployment_version:
        type: integer
      end_reason:
        type: string
      ended_at:
        type: string
      instance_id:
        type: string
      run:
        type: integer
      started_at:
        type: string
      state:
        $ref: '#/definitions/model.InstanceState'
    type: object
  model.RunCause:
    enum:
    - start
    - restart
    - update
    - incident
    - migration
    type: string
    x-enum-varnames:
    - CauseStart
    - CauseRestart
    - CauseUpdate
    - CauseIncident
    - CauseMigration
  model.Schedule:
    properties:
      alias:
        type: string
      created_at:
        type: string
      cron:
        description: cron with 5 or 6 fields (optional seconds first) or a descriptor
          such as @daily
        type: string
      deployment_id:
        type: string
      disabled:
        type: boolean
      id:
        type: string
      namespace:
        type: string
      next_due:
        type: string
      owner:
        type: string
      updated_at:
        type: string
    type: object
  model.ScheduleInput:
    properties:
      alias:
        type: string
      cron:
        type: string
      deployment_id:
        type: string
      disabled:
        type: boolean
    type: object
  model.SelectedPath:
    properties:
      characteristic_id:
        type: string
      configurables:
        items:
          $ref: '#/definitions/model.Configurable'
        type: array
      path:
        type: string
    type: object
  model.Selection:
    properties:
      device_group_id:
        type: string
      device_id:
        type: string
      import_id:
        type: string
      path:
        allOf:
        - $ref: '#/definitions/model.SelectedPath'
        description: the value of the function in the service and the values of its
          configurables
      prefer_event:
        description: read the last event value instead of sending a command, for services
          with event and request (TASK-08)
        type: boolean
      service_id:
        type: string
    type: object
  model.SelectionOption:
    properties:
      device:
        $ref: '#/definitions/model.NamedRef'
      device_group:
        $ref: '#/definitions/model.NamedRef'
      import:
        $ref: '#/definitions/model.NamedRef'
      import_type:
        $ref: '#/definitions/model.NamedRef'
      path_options:
        additionalProperties:
          items:
            type: integer
          type: array
        type: object
      services:
        items:
          $ref: '#/definitions/model.NamedRef'
        type: array
    type: object
  model.StartInstanceInput:
    properties:
      deployment_id:
        type: string
      deployment_version:
        description: 0 selects the current version
        type: integer
      owner:
        type: string
      variables:
        additionalProperties: {}
        type: object
    type: object
  model.StartParameter:
    properties:
      default:
        type: string
      id:
        type: string
      label:
        type: string
      properties:
        additionalProperties:
          type: string
        type: object
      type:
        type: string
    type: object
  model.UpdateStrategy:
    enum:
    - stop
    - drain
    - restart
    type: string
    x-enum-varnames:
    - UpdateStop
    - UpdateDrain
    - UpdateRestart
  model.UserDependents:
    properties:
      blocked:
        description: true if the deletion would be rejected because a namespace rejects
          foreign dependents
        type: boolean
      dependents:
        items:
          $ref: '#/definitions/model.Dependent'
        type: array
      owned:
        additionalProperties:
          type: integer
        description: counts of own resources per namespace and kind, e.g. "processes_models"
        type: object
      user_id:
        type: string
    type: object
  model.UserSettings:
    properties:
      max_retention_days:
        type: integer
      user_id:
        type: string
    type: object
  model.Variable:
    properties:
      element_id:
        type: string
      name:
        type: string
      type:
        type: string
      updated_at:
        type: string
      value: {}
    type: object
  model.VariableInput:
    properties:
      value: {}
    type: object
info:
  contact: {}
  description: Models, deployments and instances of processes and smart services.
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  title: Automation-Engine API
