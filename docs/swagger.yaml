      - description: namespace
        in: path
        name: ns
        required: true
        type: string
      - description: schedule id
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/model.Schedule'
        "404":
