          (DEP-09)
        type: string
      owner:
        type: string
      retention_days:
        description: retention of history in days, 0 uses the namespace default; capped
          by the limits (HIST-04)
        type: integer
      source:
        type: string
      updated_at:
        type: string
      version:
        type: integer
    type: object
