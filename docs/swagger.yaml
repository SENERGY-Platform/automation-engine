info:
  contact: {}
  description: Models, deployments and instances of processes and smart services.
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  title: Automation-Engine API
  version: "0.1"
paths:
  /deprecated/deployment/dependencies:
    get:
      deprecated: true
      parameters:
      - description: comma separated deployment ids
        in: query
        name: ids
        type: string
      - description: page size, default 100
        in: query
        name: limit
        type: integer
      - description: offset
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/deprecated.Dependencies'
            type: array
        "400":
          description: Bad Request
          schema:
            type: string
        "403":
          description: Forbidden
          schema:
            type: string
        "404":
          description: Not Found
          schema:
            type: string
      security:
      - Bearer: []
      summary: devices and events deployments use
      tags:
      - deprecated-deployment
  /deprecated/deployment/dependencies/{id}:
    get:
      deprecated: true
      parameters:
      - description: deployment id
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/deprecated.Dependencies'
        "400":
          description: Bad Request
          schema:
            type: string
        "403":
          description: Forbidden
          schema:
            type: string
        "404":
          description: Not Found
          schema:
            type: string
      security:
      - Bearer: []
      summary: devices and events a deployment uses
      tags:
      - deprecated-deployment
  /deprecated/deployment/v3/deployments:
    get:
      deprecated: true
      parameters:
      - description: page size, 0 is all
        in: query
        name: limit
        type: integer
      - description: offset
        in: query
        name: offset
        type: integer
      - description: name with .asc or .desc
        in: query
        name: sort
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/models.Deployment'
            type: array
        "400":
          description: Bad Request
          schema:
            type: string
        "403":
          description: Forbidden
          schema:
            type: string
        "404":
          description: Not Found
          schema:
            type: string
      security:
      - Bearer: []
      summary: deployments in the format version 3
      tags:
      - deprecated-deployment
    post:
      deprecated: true
      parameters:
      - description: source, e.g. sepl
        in: query
        name: source
        type: string
      - description: deployment
        in: body
        name: deployment
        required: true
        schema:
          $ref: '#/definitions/models.Deployment'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.Deployment'
        "400":
          description: Bad Request
          schema:
            type: string
        "403":
          description: Forbidden
          schema:
            type: string
        "404":
          description: Not Found
          schema:
            type: string
      security:
      - Bearer: []
      summary: deploy in the format version 3
      tags:
      - deprecated-deployment
