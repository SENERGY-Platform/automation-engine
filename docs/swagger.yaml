      model_deleted:
        description: the referenced model has been deleted; the deployment keeps its
          copy of the BPMN (MOD-08)
        type: boolean
      model_id:
        type: string
      model_version:
        type: integer
      name:
        type: string
      namespace:
        type: string
      network_id:
