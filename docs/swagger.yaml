          schema:
            $ref: '#/definitions/model.Error'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/model.Error'
      security:
      - Bearer: []
      summary: create a schedule
      tags:
      - schedules
  /namespaces/{ns}/schedules/{id}:
    delete:
      parameters:
      - description: namespace
        in: path
        name: ns
        required: true
        type: string
      - description: schedule id
        in: path
        name: id
        required: true
        type: string
      responses:
        "204":
          description: No Content
        "404":
          description: Not Found
