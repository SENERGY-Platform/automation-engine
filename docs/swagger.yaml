  /networks:
    get:
      description: Gateways the caller may read (permissions-v2 topic hubs), with
        last contact, versions, backlog of the synchronisation in both directions
        and storage (SYNC-12).
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/model.Network'
            type: array
      security:
      - Bearer: []
      summary: gateways the cloud synchronises with
      tags:
      - networks
  /networks/{id}:
    get:
      description: 'Per namespace, deployment and instance: the version the cloud
        desires, the version the gateway applied and its error (SYNC-13).'
      parameters:
      - description: network id, the hub id
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/model.Network'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/model.Error'
      security:
      - Bearer: []
      summary: a gateway with the desired and applied state of its resources
      tags:
      - networks
  /networks/{id}/import:
    put:
      consumes:
      - application/json
      description: Admins only. The body is the output of "automation-engine export-gateway"
        on the gateway, unchanged. Deployments are created with their ids, versions,
        event descriptions and device groups, for the owner of the hub in device-repository,
        and desired on the gateway in the version it runs, so that it only replaces
        their event descriptions; deployments that exist stay as they are. Missing
        process models are created from the deployment versions, also those deleted
        in the former cloud, since a gateway never learns of the deletion. Namespaces
        come from the configuration of the cloud; deployments of unknown or cloud-only
        namespaces are skipped. The gateway then sends all its instances again. Everything
        happens in one transaction (SNRGY-5066).
      parameters:
      - description: network id, the hub id
        in: path
        name: id
        required: true
        type: string
      - description: report without writing
        in: query
        name: dry_run
        type: boolean
      - description: create the network if the cloud has never heard from the gateway,
          with the import as its last contact; otherwise the first contact creates
          it
        in: query
        name: create_network
        type: boolean
      - description: export of the gateway
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/model.GatewayExport'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/model.NetworkImport'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/model.Error'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/model.Error'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/model.Error'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/model.Error'
      security:
      - Bearer: []
      summary: take over the deployments of a gateway into a new cloud
      tags:
      - networks
  /ready:
    get:
      responses:
        "200":
          description: OK
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/model.Error'
      summary: readiness probe, checks the database
      tags:
      - operation
  /users/{id}:
    delete:
      description: Admins only. Removes models, deployments and instances of the user
        in all namespaces and the user's rights on resources of others. Answers 409
        with the dependents if a namespace rejects them.
      parameters:
      - description: user id
        in: path
        name: id
        required: true
        type: string
      responses:
        "204":
          description: No Content
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/model.Error'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/model.Error'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/model.Error'
      security:
      - Bearer: []
      summary: delete everything a user owns
      tags:
      - users
  /users/{id}/dependents:
    get:
      description: Admins only. Lists own resources and resources of others that depend
        on them; blocked is true if the deletion would be rejected.
      parameters:
      - description: user id
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/model.UserDependents'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/model.Error'
      security:
      - Bearer: []
      summary: dry run of a user deletion
      tags:
      - users
  /users/{id}/settings:
    get:
      parameters:
      - description: user id
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/model.UserSettings'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/model.Error'
      security:
      - Bearer: []
      summary: limits of a user
      tags:
      - users
    put:
      consumes:
      - application/json
      parameters:
      - description: user id
        in: path
        name: id
        required: true
        type: string
      - description: settings
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/model.UserSettings'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/model.UserSettings'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/model.Error'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/model.Error'
      security:
      - Bearer: []
      summary: set limits of a user, admins only
      tags:
      - users
securityDefinitions:
  Bearer:
    description: Type "Bearer" followed by a space and JWT token.
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
