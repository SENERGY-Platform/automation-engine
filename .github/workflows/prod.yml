name: 'PROD Docker Image'

on:
  push:
    branches:
      - main
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:

jobs:
  multi:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.CR_PAT }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      # the version follows from the commit types; a tag set by hand gets no image
      - name: Bump version and push tag
        id: tag_version
        uses: mathieudutour/github-tag-action@v6.1
        with:
          release_branches: ".*"
          github_token: ${{ secrets.GITHUB_TOKEN }}
      # the Dockerfile cross-compiles, so arm64 needs no QEMU; arm/v7 is not supported (FOG-02)
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ steps.tag_version.outputs.new_tag }}
          tags: |
            smartenergyplatform/automation-engine:prod
            ghcr.io/senergy-platform/automation-engine:prod
            smartenergyplatform/automation-engine:${{ steps.tag_version.outputs.new_tag }}
            ghcr.io/senergy-platform/automation-engine:${{ steps.tag_version.outputs.new_tag }}
            smartenergyplatform/automation-engine:latest
            ghcr.io/senergy-platform/automation-engine:latest
